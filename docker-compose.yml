# LOCAL environment: Postgres + Redis + API + Web.
#   cp .env.example .env && docker compose up --build
# CLOUD environment does not use this file: see docs/CLOUD_SETUP.md
services:
  redis:
    image: redis:7-alpine
    container_name: waterpeach-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: waterpeach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waterpeach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterpeach_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-waterpeach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waterpeach} -d ${POSTGRES_DB:-waterpeach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  waterpeach-api:
    build:
      context: ./waterpeach-api
      dockerfile: Dockerfile
    container_name: waterpeach-api
    restart: unless-stopped
    environment:
      APP_ENV: local
      DEBUG: "true"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://waterpeach:waterpeach_dev_password@postgres:5432/waterpeach}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      B2B_API_KEY: ${B2B_API_KEY:-wp_dev_b2b_api_key}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  waterpeach-web:
    build:
      context: ./waterpeach-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: waterpeach-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - waterpeach-api

volumes:
  postgres_data:
  redis_data:
